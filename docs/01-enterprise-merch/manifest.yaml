      - { message: ListShipmentsRequest, response: ShipmentList }
      - { message: GetShipmentRequest, response: Shipment }
      - { message: RecordPickRequest, response: Shipment }
      - { message: CancelShipmentRequest, response: Shipment }
      - { message: EnsureInboundRequest, response: Inbound }
