        - { name: CancelShipment, request: CancelShipmentRequest, response: CancelShipmentResponse }

  - name: billing
    description: Owns the ledger, invoices and credit notes, payments and VAT returns.
    owns:
      ledger:
        objects:
          - name: invoice
            producer: billing
            states: [issued]
            initial: [issued]
            changes:
              issued: []
          - name: credit_note
            producer: billing
            states: [issued]
            initial: [issued]
            changes:
              issued: []
          - name: payment
            producer: billing
            states: [pending, settled, reversed]
            initial: [pending, settled]
            changes:
              pending: [settled, reversed]
              settled: [reversed]
          - name: vat_return
            producer: billing
            states: [filed]
            initial: [filed]
            changes:
              filed: []
          - name: supplier_bill
            producer: billing
            states: [approved, voided]
            initial: [approved]
            changes:
              approved: [voided]
      processingObjects:
        - name: invoice
          prefix: inv
          spec:
            - { name: name, type: string, immutable: true }
            - { name: kind, type: string, immutable: true }
            - { name: company_id, type: uuid, immutable: true }
            - { name: company_snapshot, type: json, immutable: true }
            - { name: lines, type: json, immutable: true }
            - { name: currency, type: string, immutable: true }
            - { name: net_minor, type: int64, immutable: true }
            - { name: vat_minor, type: int64, immutable: true }
            - { name: gross_minor, type: int64, immutable: true }
            - { name: tax_point, type: timestamp, immutable: true }
            - { name: terms_days, type: int32, immutable: true }
            - { name: corrects_invoice_id, type: uuid, nullable: true, immutable: true }
          status:
            - { name: phase, type: string }
            - { name: number, type: string, nullable: true }
            - { name: pdf_key, type: string, nullable: true }
            - { name: ledger_version, type: int64 }
            - { name: issued_at, type: timestamp, nullable: true }
            - { name: due_at, type: timestamp, nullable: true }
            - { name: send_intent_at, type: timestamp, nullable: true }
            - { name: sent_at, type: timestamp, nullable: true }
            - { name: reminders_sent, type: int32 }
            - { name: reminder_intent_at, type: timestamp, nullable: true }
            - { name: settled_at, type: timestamp, nullable: true }
        - name: payment
          prefix: pay
          spec:
            - { name: reference, type: string, immutable: true }
            - { name: invoice_id, type: uuid, nullable: true, immutable: true }
            - { name: bill_id, type: uuid, nullable: true, immutable: true }
            - { name: company_id, type: uuid, immutable: true }
            - { name: method, type: string, immutable: true }
            - { name: direction, type: string, immutable: true }
            - { name: amount_minor, type: int64, immutable: true }
            - { name: currency, type: string, immutable: true }
            - { name: value_date, type: timestamp, nullable: true }
            - { name: cancel_requested, type: bool }
          status:
            - { name: phase, type: string }
            - { name: intent_at, type: timestamp, nullable: true }
            - { name: provider_id, type: string, nullable: true }
            - { name: checkout_url, type: string, nullable: true }
            - { name: ledger_version, type: int64 }
            - { name: settled_at, type: timestamp, nullable: true }
            - { name: reversed_at, type: timestamp, nullable: true }
            - { name: failure, type: string, nullable: true }
        - name: vat_return
          prefix: vret
          spec:
            - { name: country, type: string, immutable: true }
            - { name: period, type: string, immutable: true }
            - { name: filed, type: bool }
            - { name: filing_reference, type: string, nullable: true }
          status:
            - { name: phase, type: string }
            - { name: vat_due_minor, type: int64, nullable: true }
            - { name: ledger_version, type: int64 }
            - { name: filed_at, type: timestamp, nullable: true }
        - name: supplier_bill
          prefix: sbill
          spec:
            - { name: name, type: string, immutable: true }
            - { name: supplier_slug, type: string, immutable: true }
            - { name: supplier_invoice_number, type: string, immutable: true }
            - { name: lines, type: json, immutable: true }
            - { name: currency, type: string, immutable: true }
            - { name: net_minor, type: int64, immutable: true }
            - { name: vat_minor, type: int64, immutable: true }
            - { name: gross_minor, type: int64, immutable: true }
            - { name: invoice_date, type: timestamp, immutable: true }
            - { name: due_date, type: timestamp, nullable: true, immutable: true }
            - { name: purchase_ref, type: string, nullable: true, immutable: true }
            - { name: bank_account, type: string, nullable: true, immutable: true }
            - { name: source_document_id, type: uuid, immutable: true }
            - { name: approved_by, type: string, nullable: true }
            - { name: voided, type: bool }
          status:
            - { name: phase, type: string }
            - { name: match_result, type: json, nullable: true }
            - { name: attention, type: string, nullable: true }
            - { name: ledger_version, type: int64 }
            - { name: approved_at, type: timestamp, nullable: true }
            - { name: settled_at, type: timestamp, nullable: true }
      tables:
        - name: invoice_counter
          columns:
            - { name: series, type: string, primaryKey: true }
            - { name: next_number, type: int64 }
        - name: invoice_number
          columns:
            - { name: invoice_id, type: uuid, primaryKey: true }
            - { name: series, type: string }
            - { name: number, type: string, unique: true }
            - { name: assigned_at, type: timestamp }
        - name: payment_webhook_event
          columns:
            - { name: event_id, type: string, primaryKey: true }
            - { name: provider_id, type: string }
            - { name: kind, type: string }
            - { name: payload, type: json }
            - { name: received_at, type: timestamp }
          indexes: [ { columns: [provider_id] } ]
        - name: supplier_bill_key
          columns:
            - { name: dedupe_key, type: string, primaryKey: true }
            - { name: bill_id, type: uuid }
