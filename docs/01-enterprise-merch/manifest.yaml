apiVersion: basable.com/v1
kind: ProjectPlan
project:
  language: rust
  frontend: react           # the Design Studio is an editor; see 01-architecture.md
  auth: kratos
  basableLogin: true        # lets a preview sign in without SMTP; off before customers arrive, see 05-deployment.md
  database: { instances: 1 }
nanoservices:
  - name: account
    description: Owns companies, members, departments, addresses, recipients and the audit trail.
    owns:
      tables:
        - name: company
          columns:
            - { name: id, type: uuid, primaryKey: true }
            - { name: source_name, type: string, unique: true, nullable: true }
            - { name: display_name, type: string }
            - { name: legal_name, type: string, nullable: true }
            - { name: vat_number, type: string, nullable: true }
            - { name: billing_address, type: json, nullable: true }
            - { name: country, type: string }
            - { name: currency, type: string }
            - { name: payment_gate, type: string }
            - { name: terms_days, type: int32, nullable: true }
            - { name: created_at, type: timestamp }
        - name: department
          columns:
            - { name: id, type: uuid, primaryKey: true }
            - { name: company_id, type: uuid }
            - { name: name, type: string }
            - { name: cost_center, type: string, nullable: true }
          indexes: [ { columns: [company_id] } ]
        - name: membership
          columns:
            - { name: id, type: uuid, primaryKey: true }
            - { name: company_id, type: uuid }
            - { name: email, type: string }
            - { name: identity_id, type: uuid, nullable: true }
            - { name: role, type: string }
            - { name: department_id, type: uuid, nullable: true }
            - { name: invited_at, type: timestamp }
            - { name: accepted_at, type: timestamp, nullable: true }
            - { name: removed_at, type: timestamp, nullable: true }
          indexes: [ { columns: [company_id] }, { columns: [email] }, { columns: [identity_id] } ]
        - name: staff_member
          columns:
            - { name: id, type: uuid, primaryKey: true }
            - { name: email, type: string, unique: true }
            - { name: identity_id, type: uuid, nullable: true }
            - { name: role, type: string }
            - { name: active, type: bool }
        - name: address
          columns:
            - { name: id, type: uuid, primaryKey: true }
            - { name: company_id, type: uuid }
            - { name: label, type: string }
            - { name: contact_name, type: string }
            - { name: street, type: string }
            - { name: house_number, type: string }
            - { name: postcode, type: string }
            - { name: city, type: string }
            - { name: region, type: string, nullable: true }
            - { name: country, type: string }
            - { name: phone, type: string, nullable: true }
            - { name: archived_at, type: timestamp, nullable: true }
          indexes: [ { columns: [company_id] } ]
        - name: recipient
          columns:
            - { name: id, type: uuid, primaryKey: true }
            - { name: company_id, type: uuid }
            - { name: email, type: string, nullable: true }
            - { name: first_name, type: string, nullable: true }
            - { name: last_name, type: string, nullable: true }
            - { name: phone, type: string, nullable: true }
            - { name: home_address, type: json, nullable: true }
            - { name: labels, type: json }
            - { name: source, type: string }
            - { name: erase_after, type: timestamp, nullable: true }
            - { name: erased_at, type: timestamp, nullable: true }
          indexes: [ { columns: [company_id] }, { columns: [erase_after] } ]
        - name: audit_event
          columns:
            - { name: id, type: uuid, primaryKey: true }
            - { name: company_id, type: uuid, nullable: true }
            - { name: actor, type: string }
            - { name: action, type: string }
            - { name: subject, type: string }
            - { name: detail, type: json }
            - { name: occurred_at, type: timestamp }
          indexes: [ { columns: [company_id] } ]
    schedules:
      - { name: purge_recipient_pii, every: 24h }
    handles:
      - { message: GetCompanyRequest, response: Company }
      - { message: UpdateCompanyRequest, response: Company }
      - { message: EnsureCompanyRequest, response: Company }
      - { message: ResolveMemberRequest, response: Member }
      - { message: ListMembersRequest, response: MemberList }
      - { message: InviteMemberRequest, response: Member }
      - { message: UpdateMemberRequest, response: Member }
      - { message: RemoveMemberRequest, response: Member }
      - { message: ListDepartmentsRequest, response: DepartmentList }
      - { message: UpsertDepartmentRequest, response: Department }
      - { message: ListAddressesRequest, response: AddressList }
      - { message: UpsertAddressRequest, response: Address }
      - { message: ListRecipientsRequest, response: RecipientList }
      - { message: UpsertRecipientRequest, response: Recipient }
      - { message: ImportRecipientsRequest, response: RecipientImportResult }
      - { message: EraseRecipientRequest, response: Recipient }
      - { message: ResolveRecipientsRequest, response: RecipientList }
      - { message: ListAuditEventsRequest, response: AuditEventList }
      - { message: AuditEvent }
    sends:
      - { message: SendEmailRequest, response: EmailReceipt }
    api:
      service: AccountService
      methods:
        - { name: GetCompany, request: GetCompanyRequest, response: GetCompanyResponse }
        - { name: UpdateCompany, request: UpdateCompanyRequest, response: UpdateCompanyResponse }
        - { name: ListMembers, request: ListMembersRequest, response: ListMembersResponse }
        - { name: InviteMember, request: InviteMemberRequest, response: InviteMemberResponse }
        - { name: UpdateMember, request: UpdateMemberRequest, response: UpdateMemberResponse }
        - { name: RemoveMember, request: RemoveMemberRequest, response: RemoveMemberResponse }
        - { name: ListDepartments, request: ListDepartmentsRequest, response: ListDepartmentsResponse }
        - { name: UpsertDepartment, request: UpsertDepartmentRequest, response: UpsertDepartmentResponse }
        - { name: ListAddresses, request: ListAddressesRequest, response: ListAddressesResponse }
        - { name: UpsertAddress, request: UpsertAddressRequest, response: UpsertAddressResponse }
        - { name: ListRecipients, request: ListRecipientsRequest, response: ListRecipientsResponse }
        - { name: UpsertRecipient, request: UpsertRecipientRequest, response: UpsertRecipientResponse }
        - { name: ImportRecipients, request: ImportRecipientsRequest, response: ImportRecipientsResponse }
        - { name: EraseRecipient, request: EraseRecipientRequest, response: EraseRecipientResponse }
        - { name: ListAuditEvents, request: ListAuditEventsRequest, response: ListAuditEventsResponse }

  - name: catalog
    description: Owns products, variants, list prices and decoration options, and renders the public shop pages.
    owns:
      tables:
        - name: product
          columns:
            - { name: id, type: uuid, primaryKey: true }
            - { name: slug, type: string, unique: true }
            - { name: name, type: string }
            - { name: description, type: string }
            - { name: category_slug, type: string }
            - { name: brand_slug, type: string, nullable: true }
            - { name: collections, type: json }
            - { name: attributes, type: json }
            - { name: impact_note, type: string, nullable: true }
            - { name: sustainability_labels, type: json }
            - { name: min_qty, type: int32 }
            - { name: production_days, type: int32 }
            - { name: customisable, type: bool }
            - { name: best_selling, type: bool }
            - { name: is_new, type: bool }
            - { name: weight_grams, type: int32 }
            - { name: hs_code, type: string, nullable: true }
            - { name: origin_country, type: string, nullable: true }
            - { name: published_at, type: timestamp, nullable: true }
            - { name: archived_at, type: timestamp, nullable: true }
            - { name: search_text, type: string }
          indexes: [ { columns: [category_slug] }, { columns: [archived_at] } ]
        - name: variant
          columns:
            - { name: id, type: uuid, primaryKey: true }
            - { name: product_id, type: uuid }
            - { name: colour_slug, type: string }
            - { name: sku, type: string, unique: true }
            - { name: sizes, type: json }
            - { name: archived_at, type: timestamp, nullable: true }
          indexes: [ { columns: [product_id] } ]
        - name: price_tier
          columns:
            - { name: id, type: uuid, primaryKey: true }
            - { name: product_id, type: uuid }
            - { name: currency, type: string }
            - { name: min_qty, type: int32 }
            - { name: unit_minor, type: int64 }
          indexes: [ { columns: [product_id, currency] } ]
        - name: decoration_option
          columns:
            - { name: id, type: uuid, primaryKey: true }
            - { name: product_id, type: uuid }
            - { name: print_method_slug, type: string }
            - { name: areas, type: json }
            - { name: currency, type: string }
            - { name: setup_minor, type: int64 }
            - { name: per_unit_minor, type: int64 }
          indexes: [ { columns: [product_id] } ]
        - name: product_image
          columns:
            - { name: id, type: uuid, primaryKey: true }
            - { name: product_id, type: uuid }
            - { name: variant_id, type: uuid, nullable: true }
            - { name: object_key, type: string }
            - { name: alt_text, type: string }
            - { name: position, type: int32 }
            - { name: view, type: string, nullable: true }
          indexes: [ { columns: [product_id] } ]
        - name: supplier_offer
          columns:
            - { name: id, type: uuid, primaryKey: true }
            - { name: product_id, type: uuid }
            - { name: supplier_slug, type: string }
            - { name: supplier_sku, type: string }
            - { name: currency, type: string }
            - { name: cost_minor, type: int64 }
            - { name: lead_days, type: int32 }
            - { name: preferred, type: bool }
          indexes: [ { columns: [product_id] } ]
      configTypes:
        - name: category
          prefix: cat
          fields:
            - { name: slug, type: string }
            - { name: parent_slug, type: string }
            - { name: title, type: string }
            - { name: sort_order, type: int32 }
        - name: collection
          prefix: coll
          fields:
            - { name: slug, type: string }
            - { name: title, type: string }
            - { name: active, type: bool }
        - name: brand
          prefix: brnd
          fields:
            - { name: slug, type: string }
            - { name: title, type: string }
        - name: colour
          prefix: clr
          fields:
            - { name: slug, type: string }
            - { name: title, type: string }
            - { name: hex, type: string }
            - { name: family, type: string }
        - name: print_method
          prefix: pm
          fields:
            - { name: slug, type: string }
            - { name: title, type: string }
            - { name: constraints, type: json }
        - name: supplier
          prefix: sup
          fields:
            - { name: slug, type: string }
            - { name: title, type: string }
            - { name: po_email, type: string }
            - { name: country, type: string }
            - { name: sender_domains, type: json }
            - { name: bank_accounts, type: json }
        - name: pricing_policy
          prefix: ppol
          fields:
            - { name: express_fee_bps, type: int32 }
            - { name: express_days_faster, type: int32 }
    handles:
      - { message: ListProductsRequest, response: ProductPage }
      - { message: GetProductRequest, response: Product }
      - { message: ListCategoriesRequest, response: CategoryList }
      - { message: PriceLinesRequest, response: PricedLines }
      - { message: UpsertProductRequest, response: Product }
      - { message: UpsertVariantRequest, response: Variant }
      - { message: SetPriceTiersRequest, response: Product }
      - { message: SetDecorationOptionsRequest, response: Product }
      - { message: SetSupplierOffersRequest, response: SupplierOffers }
      - { message: CreateImageUploadRequest, response: ImageUpload }
      - { message: ArchiveProductRequest, response: Product }
      - { message: GetSupplierOffersRequest, response: SupplierOffers }
      - { message: GetCustomsDataRequest, response: CustomsData }
      - { message: MatchSupplierRequest, response: SupplierMatch }
      - { message: RenderShopPageRequest, response: ShopPage }
    sends:
      - { message: ResolveMemberRequest, response: Member }
      - { message: AuditEvent }
    api:
      service: CatalogService
      methods:
        - { name: ListProducts, request: ListProductsRequest, response: ListProductsResponse }
        - { name: GetProduct, request: GetProductRequest, response: GetProductResponse }
        - { name: ListCategories, request: ListCategoriesRequest, response: ListCategoriesResponse }
        - { name: PriceLines, request: PriceLinesRequest, response: PriceLinesResponse }
        - { name: UpsertProduct, request: UpsertProductRequest, response: UpsertProductResponse }
        - { name: UpsertVariant, request: UpsertVariantRequest, response: UpsertVariantResponse }
        - { name: SetPriceTiers, request: SetPriceTiersRequest, response: SetPriceTiersResponse }
        - { name: SetDecorationOptions, request: SetDecorationOptionsRequest, response: SetDecorationOptionsResponse }
        - { name: SetSupplierOffers, request: SetSupplierOffersRequest, response: SetSupplierOffersResponse }
        - { name: CreateImageUpload, request: CreateImageUploadRequest, response: CreateImageUploadResponse }
        - { name: ArchiveProduct, request: ArchiveProductRequest, response: ArchiveProductResponse }

  - name: design
    description: Owns each company's brand assets and the proofs consultants prepare for quotes.
    owns:
      tables:
        - name: brand_profile
          columns:
            - { name: company_id, type: uuid, primaryKey: true }
            - { name: colours, type: json }
            - { name: fonts, type: json }
            - { name: guidelines, type: string, nullable: true }
            - { name: updated_at, type: timestamp }
        - name: brand_asset
          columns:
            - { name: id, type: uuid, primaryKey: true }
            - { name: company_id, type: uuid, nullable: true }
            - { name: owner_identity_id, type: uuid, nullable: true }
            - { name: kind, type: string }
            - { name: filename, type: string }
            - { name: object_key, type: string }
            - { name: mime_type, type: string }
            - { name: size_bytes, type: int64 }
            - { name: created_at, type: timestamp }
            - { name: confirmed_at, type: timestamp, nullable: true }
            - { name: deleted_at, type: timestamp, nullable: true }
          indexes: [ { columns: [company_id] }, { columns: [owner_identity_id] }, { columns: [confirmed_at] } ]
        - name: proof
          columns:
            - { name: id, type: uuid, primaryKey: true }
            - { name: subject_name, type: string }
            - { name: line_ref, type: string }
            - { name: version, type: int32 }
            - { name: preview_key, type: string }
            - { name: artwork_key, type: string }
            - { name: print_spec, type: json }
            - { name: created_by, type: string }
            - { name: created_at, type: timestamp }
            - { name: approved_at, type: timestamp, nullable: true }
            - { name: approved_by, type: string, nullable: true }
            - { name: source_design_version_id, type: uuid, nullable: true }
          indexes: [ { columns: [subject_name] } ]
        - name: design_document
          columns:
            - { name: id, type: uuid, primaryKey: true }
            - { name: company_id, type: uuid, nullable: true }
            - { name: owner_identity_id, type: uuid }
            - { name: product_id, type: uuid }
            - { name: variant_id, type: uuid, nullable: true }
            - { name: name, type: string }
            - { name: draft, type: json }
            - { name: schema_version, type: int32 }
            - { name: revision, type: int32 }
            - { name: archived_at, type: timestamp, nullable: true }
            - { name: created_at, type: timestamp }
            - { name: updated_at, type: timestamp }
          indexes: [ { columns: [company_id] }, { columns: [owner_identity_id] } ]
        - name: design_version
          columns:
            - { name: id, type: uuid, primaryKey: true }
            - { name: design_id, type: uuid }
            - { name: version, type: int32 }
            - { name: document, type: json }
            - { name: schema_version, type: int32 }
            - { name: preview_keys, type: json }
            - { name: created_by, type: string }
            - { name: created_at, type: timestamp }
          indexes: [ { columns: [design_id] } ]
        - name: design_template
          columns:
            - { name: id, type: uuid, primaryKey: true }
            - { name: slug, type: string, unique: true }
            - { name: title, type: string }
            - { name: kind, type: string }
            - { name: product_id, type: uuid, nullable: true }
            - { name: document, type: json }
            - { name: schema_version, type: int32 }
            - { name: preview_key, type: string }
            - { name: published_at, type: timestamp, nullable: true }
            - { name: sort_order, type: int32 }
          indexes: [ { columns: [kind] } ]
      configTypes:
        - name: studio_font
          prefix: sfnt
          fields:
            - { name: family, type: string }
            - { name: files, type: json }
            - { name: licence, type: string }
    externalSystems:
      - name: object_storage
        calls:
          - { name: delete_object, strategy: idempotent }
    schedules:
      - { name: purge_orphan_uploads, every: 24h }
    handles:
      - { message: GetBrandProfileRequest, response: BrandProfile }
      - { message: UpdateBrandProfileRequest, response: BrandProfile }
      - { message: ListBrandAssetsRequest, response: BrandAssetList }
      - { message: CreateAssetUploadRequest, response: AssetUpload }
      - { message: ConfirmAssetUploadRequest, response: BrandAsset }
      - { message: DeleteBrandAssetRequest, response: BrandAsset }
      - { message: CreateProofRequest, response: Proof }
      - { message: ListProofsRequest, response: ProofList }
      - { message: ApproveProofsRequest, response: ProofApproval }
      - { message: GetApprovedArtworkRequest, response: ArtworkBundle }
      - { message: CreateDesignRequest, response: DesignDocument }
      - { message: GetDesignRequest, response: DesignDocument }
      - { message: ListDesignsRequest, response: DesignList }
      - { message: SaveDesignDraftRequest, response: DesignDocument }
      - { message: SaveDesignVersionRequest, response: DesignVersion }
      - { message: ArchiveDesignRequest, response: DesignDocument }
      - { message: CreatePreviewUploadRequest, response: PreviewUpload }
      - { message: ListDesignTemplatesRequest, response: DesignTemplateList }
      - { message: GetDesignTemplateRequest, response: DesignTemplate }
      - { message: UpsertDesignTemplateRequest, response: DesignTemplate }
      - { message: ResolveDesignVersionRequest, response: DesignVersionRef }
      - { message: AdoptDesignsRequest, response: DesignAdoption }
    sends:
      - { message: ResolveMemberRequest, response: Member }
      - { message: AuditEvent }
    api:
      service: DesignService
      methods:
        - { name: GetBrandProfile, request: GetBrandProfileRequest, response: GetBrandProfileResponse }
        - { name: UpdateBrandProfile, request: UpdateBrandProfileRequest, response: UpdateBrandProfileResponse }
        - { name: ListBrandAssets, request: ListBrandAssetsRequest, response: ListBrandAssetsResponse }
        - { name: CreateAssetUpload, request: CreateAssetUploadRequest, response: CreateAssetUploadResponse }
        - { name: ConfirmAssetUpload, request: ConfirmAssetUploadRequest, response: ConfirmAssetUploadResponse }
        - { name: DeleteBrandAsset, request: DeleteBrandAssetRequest, response: DeleteBrandAssetResponse }
        - { name: CreateProof, request: CreateProofRequest, response: CreateProofResponse }
        - { name: ListProofs, request: ListProofsRequest, response: ListProofsResponse }
        - { name: CreateDesign, request: CreateDesignRequest, response: CreateDesignResponse }
        - { name: GetDesign, request: GetDesignRequest, response: GetDesignResponse }
        - { name: ListDesigns, request: ListDesignsRequest, response: ListDesignsResponse }
        - { name: SaveDesignDraft, request: SaveDesignDraftRequest, response: SaveDesignDraftResponse }
        - { name: SaveDesignVersion, request: SaveDesignVersionRequest, response: SaveDesignVersionResponse }
        - { name: ArchiveDesign, request: ArchiveDesignRequest, response: ArchiveDesignResponse }
        - { name: CreatePreviewUpload, request: CreatePreviewUploadRequest, response: CreatePreviewUploadResponse }
        - { name: ListDesignTemplates, request: ListDesignTemplatesRequest, response: ListDesignTemplatesResponse }
        - { name: GetDesignTemplate, request: GetDesignTemplateRequest, response: GetDesignTemplateResponse }
        - { name: UpsertDesignTemplate, request: UpsertDesignTemplateRequest, response: UpsertDesignTemplateResponse }

  - name: order
    description: Takes a request from quote to signature, then drives each order through invoicing, production and delivery.
    owns:
      processingObjects:
        - name: quote
          prefix: quo
          spec:
            - { name: contact, type: json }
            - { name: contact_email, type: string, immutable: true }
            - { name: company_id, type: uuid, nullable: true }
            - { name: delivery, type: json }
            - { name: timeline, type: string }
            - { name: deadline_note, type: string, nullable: true }
            - { name: consultant_id, type: uuid, nullable: true }
            - { name: published_version, type: int32 }
            - { name: valid_until, type: timestamp, nullable: true }
            - { name: withdrawn, type: bool }
            - { name: requested_at, type: timestamp, immutable: true }
            - { name: sla_due_at, type: timestamp, immutable: true }
            - { name: source_order_id, type: uuid, nullable: true, immutable: true }
            - { name: source_document_id, type: uuid, nullable: true, immutable: true }
          status:
            - { name: phase, type: string }
            - { name: sla_alerted_at, type: timestamp, nullable: true }
            - { name: sent_version, type: int32 }
            - { name: send_intent_at, type: timestamp, nullable: true }
            - { name: signed_version, type: int32, nullable: true }
            - { name: order_id, type: uuid, nullable: true }
            - { name: expired_at, type: timestamp, nullable: true }
        - name: order
          prefix: ord
          spec:
            - { name: quote_id, type: uuid, immutable: true }
            - { name: quote_version, type: int32, immutable: true }
            - { name: company_id, type: uuid, immutable: true }
            - { name: lines, type: json, immutable: true }
            - { name: currency, type: string, immutable: true }
            - { name: delivery, type: json, immutable: true }
            - { name: timeline, type: string, immutable: true }
            - { name: payment_gate, type: string, immutable: true }
            - { name: cancel_requested, type: bool }
          status:
            - { name: phase, type: string }
            - { name: invoice_id, type: string, nullable: true }
            - { name: paid_at, type: timestamp, nullable: true }
            - { name: production_started_at, type: timestamp, nullable: true }
            - { name: received_at, type: timestamp, nullable: true }
            - { name: completed_at, type: timestamp, nullable: true }
            - { name: attention, type: string, nullable: true }
        - name: production_run
          prefix: prun
          spec:
            - { name: order_id, type: uuid, immutable: true }
            - { name: order_generation, type: int64 }
            - { name: supplier_slug, type: string, immutable: true }
            - { name: lines, type: json, immutable: true }
            - { name: destination, type: json, immutable: true }
            - { name: due_on, type: timestamp }
            - { name: cancel_requested, type: bool }
          status:
            - { name: phase, type: string }
            - { name: po_intent_at, type: timestamp, nullable: true }
            - { name: po_sent_at, type: timestamp, nullable: true }
            - { name: acknowledged_at, type: timestamp, nullable: true }
            - { name: supplier_ref, type: string, nullable: true }
            - { name: expected_at, type: timestamp, nullable: true }
            - { name: inbound_id, type: string, nullable: true }
            - { name: received_at, type: timestamp, nullable: true }
            - { name: carrier, type: string, nullable: true }
            - { name: tracking_number, type: string, nullable: true }
      tables:
        - name: quote_version
          columns:
            - { name: id, type: uuid, primaryKey: true }
            - { name: quote_id, type: uuid }
            - { name: version, type: int32 }
            - { name: lines, type: json }
            - { name: shipping_minor, type: int64 }
            - { name: handling_minor, type: int64 }
            - { name: currency, type: string }
            - { name: note, type: string, nullable: true }
            - { name: published_at, type: timestamp, nullable: true }
            - { name: published_by, type: string, nullable: true }
          indexes: [ { columns: [quote_id] } ]
        - name: quote_signature
          columns:
            - { name: id, type: uuid, primaryKey: true }
            - { name: quote_id, type: uuid }
            - { name: version, type: int32 }
            - { name: signer_identity_id, type: uuid }
            - { name: signer_name, type: string }
            - { name: signer_email, type: string }
            - { name: po_number, type: string, nullable: true }
            - { name: signed_at, type: timestamp }
          indexes: [ { columns: [quote_id] } ]
        - name: quote_comment
          columns:
            - { name: id, type: uuid, primaryKey: true }
            - { name: quote_id, type: uuid }
            - { name: author, type: string }
            - { name: body, type: string }
            - { name: created_at, type: timestamp }
          indexes: [ { columns: [quote_id] } ]
        - name: production_event
          columns:
            - { name: id, type: uuid, primaryKey: true }
