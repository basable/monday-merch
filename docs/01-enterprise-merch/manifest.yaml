  - name: notifier
    description: Sends one templated email per request, keyed by the caller.
    owns:
      configTypes:
        - name: email_template
          prefix: etpl
          fields:
            - { name: slug, type: string }
            - { name: locale, type: string }
            - { name: subject, type: string }
            - { name: body_html, type: string }
            - { name: body_text, type: string }
    externalSystems:
      - name: email
        calls:
          - { name: send_email, strategy: keyed_replay, irreversible: true, replayWindow: 24h }
    handles:
      - { message: SendEmailRequest, response: EmailReceipt }

  - name: inbox
    description: Receives email, stores it, extracts structured data from each document, and routes the result to its owner or a review queue.
    owns:
      processingObjects:
        - name: inbound_message
          prefix: imsg
          spec:
            - { name: provider_message_id, type: string, immutable: true }
            - { name: to_address, type: string, immutable: true }
            - { name: from_address, type: string, immutable: true }
            - { name: subject, type: string, immutable: true }
            - { name: received_at, type: timestamp, immutable: true }
          status:
            - { name: phase, type: string }
            - { name: raw_key, type: string, nullable: true }
            - { name: message_id_header, type: string, nullable: true }
            - { name: sender_supplier_slug, type: string, nullable: true }
            - { name: sender_verified, type: bool, nullable: true }
            - { name: route_hint, type: string, nullable: true }
            - { name: document_count, type: int32, nullable: true }
            - { name: rejection, type: string, nullable: true }
        - name: inbound_document
          prefix: idoc
          spec:
            - { name: message_id, type: uuid, immutable: true }
            - { name: part_name, type: string, immutable: true }
            - { name: object_key, type: string, immutable: true }
            - { name: mime_type, type: string, immutable: true }
            - { name: sha256, type: string, immutable: true }
            - { name: sender_supplier_slug, type: string, nullable: true, immutable: true }
            - { name: sender_verified, type: bool, immutable: true }
            - { name: route_hint, type: string, nullable: true, immutable: true }
          status:
            - { name: phase, type: string }
            - { name: kind, type: string, nullable: true }
            - { name: extraction, type: json, nullable: true }
            - { name: model, type: string, nullable: true }
            - { name: checks, type: json, nullable: true }
            - { name: review_reason, type: string, nullable: true }
            - { name: routed_to, type: string, nullable: true }
            - { name: routed_ref, type: string, nullable: true }
            - { name: applied_at, type: timestamp, nullable: true }
      tables:
        - name: inbound_seen
          columns:
            - { name: provider_message_id, type: string, primaryKey: true }
            - { name: message_object_id, type: uuid }
            - { name: first_seen_at, type: timestamp }
        - name: review_decision
          columns:
            - { name: id, type: uuid, primaryKey: true }
            - { name: document_id, type: uuid }
            - { name: decision, type: string }
            - { name: corrected_kind, type: string, nullable: true }
            - { name: corrections, type: json, nullable: true }
            - { name: actor, type: string }
            - { name: decided_at, type: timestamp }
          indexes: [ { columns: [document_id] } ]
      configTypes:
        - name: inbox_policy
          prefix: ipol
          fields:
            - { name: max_attachment_bytes, type: int64 }
            - { name: allowed_mime_types, type: json }
            - { name: auto_apply_kinds, type: json }
            - { name: retention_days, type: int32 }
            - { name: model, type: string }
            - { name: effort, type: string }
    externalSystems:
      - name: object_storage
        calls:
          - { name: store_inbound_object, strategy: idempotent }
          - { name: delete_inbound_object, strategy: idempotent }
      - name: llm
        calls:
          - { name: extract_document, strategy: idempotent }
    webhooks:
      - { provider: inbound_mail }
    schedules:
      - { name: purge_inbound, every: 24h }
    handles:
      - { message: ListInboundMessagesRequest, response: InboundMessageList }
      - { message: ListReviewQueueRequest, response: InboundDocumentList }
      - { message: GetInboundDocumentRequest, response: InboundDocument }
      - { message: GetInboundFileLinkRequest, response: DownloadLink }
      - { message: DecideInboundDocumentRequest, response: InboundDocument }
      - { message: InboundEmailEvent, response: WebhookAck }
    sends:
      - { message: ResolveMemberRequest, response: Member }
      - { message: MatchSupplierRequest, response: SupplierMatch }
      - { message: EnsureSupplierBillRequest, response: SupplierBill }
      - { message: RecordSupplierUpdateRequest, response: ProductionRun }
      - { message: IngestCustomerEmailRequest, response: Quote }
      - { message: SendEmailRequest, response: EmailReceipt }
      - { message: AuditEvent }
    api:
      service: InboxService
      methods:
        - { name: ListInboundMessages, request: ListInboundMessagesRequest, response: ListInboundMessagesResponse }
        - { name: ListReviewQueue, request: ListReviewQueueRequest, response: ListReviewQueueResponse }
        - { name: GetInboundDocument, request: GetInboundDocumentRequest, response: GetInboundDocumentResponse }
        - { name: GetInboundFileLink, request: GetInboundFileLinkRequest, response: GetInboundFileLinkResponse }
        - { name: DecideInboundDocument, request: DecideInboundDocumentRequest, response: DecideInboundDocumentResponse }
