    externalSystems:
      - name: carrier
        calls:
          - { name: create_label, strategy: declared, irreversible: true }
          - { name: void_label, strategy: idempotent }
    webhooks:
      - { provider: carrier }
    schedules:
      - { name: check_low_stock, every: 1h }
      - { name: purge_shipment_addresses, every: 24h }
    handles:
      - { message: EstimateDeliveryRequest, response: DeliveryEstimate }
      - { message: ListStockRequest, response: StockList }
      - { message: SetLowStockRuleRequest, response: LowStockRule }
      - { message: AdjustStockRequest, response: StockLevel }
      - { message: ListKitsRequest, response: KitList }
      - { message: UpsertKitRequest, response: Kit }
