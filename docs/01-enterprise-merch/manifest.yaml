        - { name: GetInvoiceDownload, request: GetInvoiceDownloadRequest, response: GetInvoiceDownloadResponse }
        - { name: PayInvoiceByCard, request: PayInvoiceByCardRequest, response: PayInvoiceByCardResponse }
        - { name: RecordBankPayment, request: RecordBankPaymentRequest, response: RecordBankPaymentResponse }
        - { name: IssueCreditNote, request: IssueCreditNoteRequest, response: IssueCreditNoteResponse }
        - { name: RecordRefund, request: RecordRefundRequest, response: RecordRefundResponse }
        - { name: GetSpendReport, request: GetSpendReportRequest, response: GetSpendReportResponse }
        - { name: DraftVatReturn, request: DraftVatReturnRequest, response: DraftVatReturnResponse }
        - { name: MarkVatReturnFiled, request: MarkVatReturnFiledRequest, response: MarkVatReturnFiledResponse }
        - { name: GetTrialBalance, request: GetTrialBalanceRequest, response: GetTrialBalanceResponse }
