      - { message: GetSupplierBillRequest, response: SupplierBill }
      - { message: ApproveSupplierBillRequest, response: SupplierBill }
      - { message: VoidSupplierBillRequest, response: SupplierBill }
      - { message: RecordSupplierPaymentRequest, response: Payment }
      - { message: PaymentWebhookEvent, response: WebhookAck }
    sends:
