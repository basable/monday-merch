          - { name: expire_checkout_session, strategy: idempotent }
          - { name: create_refund, strategy: keyed_replay, irreversible: true, replayWindow: 24h }
      - name: object_storage
        calls:
          - { name: store_document, strategy: idempotent }
    webhooks:
      - { provider: payments }
    handles:
      - { message: EnsureInvoiceRequest, response: Invoice }
      - { message: ListInvoicesRequest, response: InvoiceList }
      - { message: GetInvoiceRequest, response: Invoice }
