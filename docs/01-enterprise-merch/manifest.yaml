        - { name: SetLowStockRule, request: SetLowStockRuleRequest, response: SetLowStockRuleResponse }
        - { name: AdjustStock, request: AdjustStockRequest, response: AdjustStockResponse }
        - { name: ListKits, request: ListKitsRequest, response: ListKitsResponse }
        - { name: UpsertKit, request: UpsertKitRequest, response: UpsertKitResponse }
        - { name: CreateAssemblyOrder, request: CreateAssemblyOrderRequest, response: CreateAssemblyOrderResponse }
        - { name: RecordAssembly, request: RecordAssemblyRequest, response: RecordAssemblyResponse }
        - { name: ListInbound, request: ListInboundRequest, response: ListInboundResponse }
        - { name: RecordInboundReceipt, request: RecordInboundReceiptRequest, response: RecordInboundReceiptResponse }
