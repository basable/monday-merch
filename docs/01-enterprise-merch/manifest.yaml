  - name: fulfilment
    description: Owns held stock, kits and inbound goods, and drives each shipment from reservation to delivery.
    owns:
      processingObjects:
        - name: shipment
          prefix: shp
          spec:
            - { name: name, type: string, immutable: true }
            - { name: source_generation, type: int64 }
            - { name: company_id, type: uuid, immutable: true }
            - { name: batch_id, type: uuid, nullable: true, immutable: true }
            - { name: warehouse_slug, type: string, immutable: true }
            - { name: lines, type: json, immutable: true }
            - { name: service_level, type: string, immutable: true }
            - { name: incoterm, type: string, immutable: true }
            - { name: cancel_requested, type: bool }
          status:
            - { name: phase, type: string }
            - { name: reserved_at, type: timestamp, nullable: true }
            - { name: picked_at, type: timestamp, nullable: true }
            - { name: label_slot, type: string, nullable: true }
            - { name: label_id, type: string, nullable: true }
            - { name: label_key, type: string, nullable: true }
            - { name: carrier, type: string, nullable: true }
            - { name: tracking_number, type: string, nullable: true }
            - { name: dispatched_at, type: timestamp, nullable: true }
            - { name: delivered_at, type: timestamp, nullable: true }
            - { name: exception, type: string, nullable: true }
      tables:
        - name: stock_item
          columns:
            - { name: id, type: uuid, primaryKey: true }
            - { name: company_id, type: uuid }
            - { name: name, type: string }
            - { name: product_id, type: uuid, nullable: true }
            - { name: variant_id, type: uuid, nullable: true }
            - { name: size, type: string, nullable: true }
            - { name: proof_id, type: uuid, nullable: true }
            - { name: is_kit, type: bool }
          indexes: [ { columns: [company_id] } ]
        - name: stock_level
          columns:
            - { name: id, type: uuid, primaryKey: true }
            - { name: stock_item_id, type: uuid }
            - { name: warehouse_slug, type: string }
            - { name: on_hand, type: int32 }
            - { name: reserved, type: int32 }
          indexes: [ { columns: [stock_item_id, warehouse_slug] } ]
        - name: stock_movement
          columns:
            - { name: id, type: uuid, primaryKey: true }
            - { name: stock_item_id, type: uuid }
            - { name: warehouse_slug, type: string }
            - { name: kind, type: string }
            - { name: on_hand_delta, type: int32 }
            - { name: reserved_delta, type: int32 }
            - { name: source, type: string }
            - { name: actor, type: string }
            - { name: occurred_at, type: timestamp }
          indexes: [ { columns: [stock_item_id] }, { columns: [source] } ]
        - name: kit_component
          columns:
            - { name: id, type: uuid, primaryKey: true }
            - { name: kit_item_id, type: uuid }
            - { name: component_item_id, type: uuid }
            - { name: quantity, type: int32 }
          indexes: [ { columns: [kit_item_id] } ]
        - name: assembly_order
          columns:
            - { name: id, type: uuid, primaryKey: true }
            - { name: company_id, type: uuid }
            - { name: kit_item_id, type: uuid }
            - { name: warehouse_slug, type: string }
            - { name: quantity, type: int32 }
            - { name: completed_at, type: timestamp, nullable: true }
            - { name: cancelled_at, type: timestamp, nullable: true }
          indexes: [ { columns: [company_id] } ]
        - name: inbound
          columns:
            - { name: id, type: uuid, primaryKey: true }
            - { name: name, type: string, unique: true }
            - { name: source_generation, type: int64 }
            - { name: company_id, type: uuid }
            - { name: warehouse_slug, type: string }
            - { name: lines, type: json }
            - { name: received_lines, type: json }
            - { name: received_at, type: timestamp, nullable: true }
          indexes: [ { columns: [received_at] } ]
        - name: low_stock_rule
          columns:
            - { name: id, type: uuid, primaryKey: true }
            - { name: stock_item_id, type: uuid, unique: true }
            - { name: threshold, type: int32 }
            - { name: notify_email, type: string }
        - name: shipment_batch
          columns:
            - { name: id, type: uuid, primaryKey: true }
            - { name: company_id, type: uuid }
            - { name: created_by, type: string }
            - { name: charges, type: json }
            - { name: created_at, type: timestamp }
          indexes: [ { columns: [company_id] } ]
        - name: shipment_address
          columns:
            - { name: shipment_id, type: uuid, primaryKey: true }
            - { name: address, type: json, nullable: true }
            - { name: erase_after, type: timestamp, nullable: true }
            - { name: erased_at, type: timestamp, nullable: true }
          indexes: [ { columns: [erase_after] } ]
        - name: shipment_event
          columns:
            - { name: id, type: uuid, primaryKey: true }
            - { name: shipment_id, type: uuid }
            - { name: kind, type: string }
            - { name: detail, type: json }
            - { name: dedupe_key, type: string, unique: true }
            - { name: occurred_at, type: timestamp }
          indexes: [ { columns: [shipment_id] } ]
      configTypes:
        - name: warehouse
          prefix: wh
