syntax = "proto3";

package order.v1;

// OrderService: the API of nanoservice `order`. Fill the
// message fields; the build regenerates the Rust types and the Connect stubs.
service OrderService {
  rpc RequestQuote(RequestQuoteRequest) returns (RequestQuoteResponse);
  rpc ListQuotes(ListQuotesRequest) returns (ListQuotesResponse);
  rpc GetQuote(GetQuoteRequest) returns (GetQuoteResponse);
  rpc AssignQuote(AssignQuoteRequest) returns (AssignQuoteResponse);
  rpc PublishQuoteVersion(PublishQuoteVersionRequest) returns (PublishQuoteVersionResponse);
  rpc RequestQuoteChanges(RequestQuoteChangesRequest) returns (RequestQuoteChangesResponse);
  rpc AcceptQuote(AcceptQuoteRequest) returns (AcceptQuoteResponse);
  rpc Reorder(ReorderRequest) returns (ReorderResponse);
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);
  rpc ListProductionRuns(ListProductionRunsRequest) returns (ListProductionRunsResponse);
  rpc RecordProductionEvent(RecordProductionEventRequest) returns (RecordProductionEventResponse);
  rpc SubmitLead(SubmitLeadRequest) returns (SubmitLeadResponse);
}

