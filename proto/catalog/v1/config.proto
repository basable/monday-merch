syntax = "proto3";

package catalog.v1;

import "basable/config/v1/config.proto";

// The configuration messages nanoservice `catalog` declares. Each
// embeds the ConfigHeader; a reference field is a string that holds a
// #{Type:namespace:name} reference in the seed and the target's id once
// loaded. Edit the plan's configTypes, not this file.

// CategoryConfiguration (id 100, public ids `cat_…`).
message CategoryConfiguration {
  basable.config.v1.ConfigHeader header = 1;
  string slug = 2;
  string parent_slug = 3;
  string title = 4;
  int32 sort_order = 5;
}

// CollectionConfiguration (id 101, public ids `coll_…`).
message CollectionConfiguration {
  basable.config.v1.ConfigHeader header = 1;
  string slug = 2;
  string title = 3;
  bool active = 4;
}

// BrandConfiguration (id 102, public ids `brnd_…`).
message BrandConfiguration {
  basable.config.v1.ConfigHeader header = 1;
  string slug = 2;
  string title = 3;
}

// ColourConfiguration (id 103, public ids `clr_…`).
message ColourConfiguration {
  basable.config.v1.ConfigHeader header = 1;
  string slug = 2;
  string title = 3;
  string hex = 4;
  string family = 5;
}

// PrintMethodConfiguration (id 104, public ids `pm_…`).
message PrintMethodConfiguration {
  basable.config.v1.ConfigHeader header = 1;
  string slug = 2;
  string title = 3;
  string constraints = 4;
}

// SupplierConfiguration (id 105, public ids `sup_…`).
message SupplierConfiguration {
  basable.config.v1.ConfigHeader header = 1;
  string slug = 2;
  string title = 3;
  string po_email = 4;
  string country = 5;
  string sender_domains = 6;
  string bank_accounts = 7;
}

// PricingPolicyConfiguration (id 106, public ids `ppol_…`).
message PricingPolicyConfiguration {
  basable.config.v1.ConfigHeader header = 1;
  int32 express_fee_bps = 2;
  int32 express_days_faster = 3;
}
