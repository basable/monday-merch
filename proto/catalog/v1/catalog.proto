syntax = "proto3";

package catalog.v1;

// CatalogService: the API of nanoservice `catalog`. Fill the
// message fields; the build regenerates the Rust types and the Connect stubs.
service CatalogService {
  rpc ListProducts(ListProductsRequest) returns (ListProductsResponse);
  rpc GetProduct(GetProductRequest) returns (GetProductResponse);
  rpc ListCategories(ListCategoriesRequest) returns (ListCategoriesResponse);
  rpc PriceLines(PriceLinesRequest) returns (PriceLinesResponse);
  rpc UpsertProduct(UpsertProductRequest) returns (UpsertProductResponse);
  rpc UpsertVariant(UpsertVariantRequest) returns (UpsertVariantResponse);
  rpc SetPriceTiers(SetPriceTiersRequest) returns (SetPriceTiersResponse);
  rpc SetDecorationOptions(SetDecorationOptionsRequest) returns (SetDecorationOptionsResponse);
  rpc SetSupplierOffers(SetSupplierOffersRequest) returns (SetSupplierOffersResponse);
  rpc CreateImageUpload(CreateImageUploadRequest) returns (CreateImageUploadResponse);
  rpc ArchiveProduct(ArchiveProductRequest) returns (ArchiveProductResponse);
}

