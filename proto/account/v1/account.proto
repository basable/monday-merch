syntax = "proto3";

package account.v1;

// AccountService: the API of nanoservice `account`. Fill the
// message fields; the build regenerates the Rust types and the Connect stubs.
service AccountService {
  rpc GetCompany(GetCompanyRequest) returns (GetCompanyResponse);
  rpc UpdateCompany(UpdateCompanyRequest) returns (UpdateCompanyResponse);
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);
  rpc InviteMember(InviteMemberRequest) returns (InviteMemberResponse);
  rpc UpdateMember(UpdateMemberRequest) returns (UpdateMemberResponse);
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse);
  rpc ListDepartments(ListDepartmentsRequest) returns (ListDepartmentsResponse);
  rpc UpsertDepartment(UpsertDepartmentRequest) returns (UpsertDepartmentResponse);
  rpc ListAddresses(ListAddressesRequest) returns (ListAddressesResponse);
  rpc UpsertAddress(UpsertAddressRequest) returns (UpsertAddressResponse);
  rpc ListRecipients(ListRecipientsRequest) returns (ListRecipientsResponse);
  rpc UpsertRecipient(UpsertRecipientRequest) returns (UpsertRecipientResponse);
  rpc ImportRecipients(ImportRecipientsRequest) returns (ImportRecipientsResponse);
  rpc EraseRecipient(EraseRecipientRequest) returns (EraseRecipientResponse);
  rpc ListAuditEvents(ListAuditEventsRequest) returns (ListAuditEventsResponse);
}

