syntax = "proto3";

package design.v1;

// DesignService: the API of nanoservice `design`. Fill the
// message fields; the build regenerates the Rust types and the Connect stubs.
service DesignService {
  rpc GetBrandProfile(GetBrandProfileRequest) returns (GetBrandProfileResponse);
  rpc UpdateBrandProfile(UpdateBrandProfileRequest) returns (UpdateBrandProfileResponse);
  rpc ListBrandAssets(ListBrandAssetsRequest) returns (ListBrandAssetsResponse);
  rpc CreateAssetUpload(CreateAssetUploadRequest) returns (CreateAssetUploadResponse);
  rpc ConfirmAssetUpload(ConfirmAssetUploadRequest) returns (ConfirmAssetUploadResponse);
  rpc DeleteBrandAsset(DeleteBrandAssetRequest) returns (DeleteBrandAssetResponse);
  rpc CreateProof(CreateProofRequest) returns (CreateProofResponse);
  rpc ListProofs(ListProofsRequest) returns (ListProofsResponse);
  rpc CreateDesign(CreateDesignRequest) returns (CreateDesignResponse);
  rpc GetDesign(GetDesignRequest) returns (GetDesignResponse);
  rpc ListDesigns(ListDesignsRequest) returns (ListDesignsResponse);
  rpc SaveDesignDraft(SaveDesignDraftRequest) returns (SaveDesignDraftResponse);
  rpc SaveDesignVersion(SaveDesignVersionRequest) returns (SaveDesignVersionResponse);
  rpc ArchiveDesign(ArchiveDesignRequest) returns (ArchiveDesignResponse);
  rpc CreatePreviewUpload(CreatePreviewUploadRequest) returns (CreatePreviewUploadResponse);
  rpc ListDesignTemplates(ListDesignTemplatesRequest) returns (ListDesignTemplatesResponse);
  rpc GetDesignTemplate(GetDesignTemplateRequest) returns (GetDesignTemplateResponse);
  rpc UpsertDesignTemplate(UpsertDesignTemplateRequest) returns (UpsertDesignTemplateResponse);
}

