syntax = "proto3";

package billing.v1;

// BillingService: the API of nanoservice `billing`. Fill the
// message fields; the build regenerates the Rust types and the Connect stubs.
service BillingService {
  rpc ListInvoices(ListInvoicesRequest) returns (ListInvoicesResponse);
  rpc GetInvoice(GetInvoiceRequest) returns (GetInvoiceResponse);
  rpc GetInvoiceDownload(GetInvoiceDownloadRequest) returns (GetInvoiceDownloadResponse);
  rpc PayInvoiceByCard(PayInvoiceByCardRequest) returns (PayInvoiceByCardResponse);
  rpc RecordBankPayment(RecordBankPaymentRequest) returns (RecordBankPaymentResponse);
  rpc IssueCreditNote(IssueCreditNoteRequest) returns (IssueCreditNoteResponse);
  rpc RecordRefund(RecordRefundRequest) returns (RecordRefundResponse);
  rpc GetSpendReport(GetSpendReportRequest) returns (GetSpendReportResponse);
  rpc DraftVatReturn(DraftVatReturnRequest) returns (DraftVatReturnResponse);
  rpc MarkVatReturnFiled(MarkVatReturnFiledRequest) returns (MarkVatReturnFiledResponse);
  rpc GetTrialBalance(GetTrialBalanceRequest) returns (GetTrialBalanceResponse);
  rpc ListSupplierBills(ListSupplierBillsRequest) returns (ListSupplierBillsResponse);
  rpc GetSupplierBill(GetSupplierBillRequest) returns (GetSupplierBillResponse);
  rpc ApproveSupplierBill(ApproveSupplierBillRequest) returns (ApproveSupplierBillResponse);
  rpc VoidSupplierBill(VoidSupplierBillRequest) returns (VoidSupplierBillResponse);
  rpc RecordSupplierPayment(RecordSupplierPaymentRequest) returns (RecordSupplierPaymentResponse);
}

