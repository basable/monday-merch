syntax = "proto3";

package fulfilment.v1;

// FulfilmentService: the API of nanoservice `fulfilment`. Fill the
// message fields; the build regenerates the Rust types and the Connect stubs.
service FulfilmentService {
  rpc EstimateDelivery(EstimateDeliveryRequest) returns (EstimateDeliveryResponse);
  rpc ListStock(ListStockRequest) returns (ListStockResponse);
  rpc SetLowStockRule(SetLowStockRuleRequest) returns (SetLowStockRuleResponse);
  rpc AdjustStock(AdjustStockRequest) returns (AdjustStockResponse);
  rpc ListKits(ListKitsRequest) returns (ListKitsResponse);
  rpc UpsertKit(UpsertKitRequest) returns (UpsertKitResponse);
  rpc CreateAssemblyOrder(CreateAssemblyOrderRequest) returns (CreateAssemblyOrderResponse);
  rpc RecordAssembly(RecordAssemblyRequest) returns (RecordAssemblyResponse);
  rpc ListInbound(ListInboundRequest) returns (ListInboundResponse);
  rpc RecordInboundReceipt(RecordInboundReceiptRequest) returns (RecordInboundReceiptResponse);
  rpc CreateShipments(CreateShipmentsRequest) returns (CreateShipmentsResponse);
  rpc ListShipments(ListShipmentsRequest) returns (ListShipmentsResponse);
  rpc GetShipment(GetShipmentRequest) returns (GetShipmentResponse);
  rpc RecordPick(RecordPickRequest) returns (RecordPickResponse);
  rpc CancelShipment(CancelShipmentRequest) returns (CancelShipmentResponse);
}

