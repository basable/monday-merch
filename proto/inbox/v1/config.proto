syntax = "proto3";

package inbox.v1;

import "basable/config/v1/config.proto";

// The configuration messages nanoservice `inbox` declares. Each
// embeds the ConfigHeader; a reference field is a string that holds a
// #{Type:namespace:name} reference in the seed and the target's id once
// loaded. Edit the plan's configTypes, not this file.

// InboxPolicyConfiguration (id 115, public ids `ipol_…`).
message InboxPolicyConfiguration {
  basable.config.v1.ConfigHeader header = 1;
  int64 max_attachment_bytes = 2;
  string allowed_mime_types = 3;
  string auto_apply_kinds = 4;
  int32 retention_days = 5;
  string model = 6;
  string effort = 7;
}
